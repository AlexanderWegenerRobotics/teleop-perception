detector:
  corner_refinement: apriltag
  corner_offset_px: -0.5
  corner_refinement_win: 5
  corner_refinement_max_iter: 50
  corner_refinement_min_accuracy: 0.01
  adaptive_thresh_win_min: 3
  adaptive_thresh_win_max: 33
  adaptive_thresh_win_step: 10
  min_marker_perimeter_rate: 0.02

estimation:
  min_side_px: 14
  max_view_angle_deg: 65.0
  max_tag_reproj_px: 2.0
  min_tags: 1

fusion:
  mode: joint
  view_gate_px: 2.0
  rms_floor_px: 0.15
  max_cam_disagreement_m: 0.01
  sync_window_ms: 100

smoothing:
  enabled: true
  window: 15
  still_pos_m: 0.0015
  still_rot_deg: 1.0

runtime:
  stale_after_ms: 500
  idle_sleep_ms: 2
