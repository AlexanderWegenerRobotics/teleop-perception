mode: sim

board: boards/fmb_board_1.yaml

cameras:
  sim: cameras/sim.yaml
  real: cameras/real.yaml

detection: detection.yaml
reference: reference.yaml
network: network.yaml
calibration: calibration.yaml

logging:
  enabled: true
  dir: ../logs

sim:
  root: ../../teleop-simulator
  run_dir: build
  task_config: config/tasks/FMB_board_1.yaml
  tagged_task_config: config/tasks/FMB_board_1_tagged.yaml
  generated_dir: models/mujoco/props/perception
  gripper_model: models/mujoco/robots/franka_fr3/hand.xml
  gripper_device: hand_left
  base_sim_config: config/sim_config_franka_desk.yaml
  base_pipeline_config: config/pipeline_config_desk_local.yaml
  base_robot_config: config/robot_config_desk_local.yaml
  out_sim_config: config/sim_config_franka_desk_perception.yaml
  out_pipeline_config: config/pipeline_config_desk_local_perception.yaml
  out_robot_config: config/robot_config_desk_local_perception.yaml
  authority_stale_ms: 1000
